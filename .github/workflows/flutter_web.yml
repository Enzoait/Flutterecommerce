name: Build & Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - uses: actions/checkout@v3

      # 2. Installer Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'

      # 3. Fix safe directory, upgrade Flutter, et installer les dépendances
      - name: Prepare Flutter Environment
        run: |
          git config --global --add safe.directory /opt/hostedtoolcache/flutter/stable-3.3.10-x64
          flutter channel stable
          flutter upgrade --force
          flutter doctor
          flutter pub get

      # 4. Build Flutter Web!
      - name: Build Flutter Web
        run: flutter build web --release

      # 5. Déployer sur Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_SECRET }}
          vercel-org-id: ${{ secrets.TEAM_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: ./build/web
          prod: true
